name: Autofix — Reusable

on:
  workflow_call:
    inputs:
      flutter_version:
        type: string
        required: true
      working_dir:
        type: string
        default: .
      core_access_app_id:
        type: string
        required: true
    secrets:
      autofix_token:
        description: >-
          Optional PAT or GitHub App token with contents:write. When set, the
          autofix push is performed under this identity, which DOES re-trigger
          downstream workflows. Falls back to GITHUB_TOKEN if not provided.
        required: false

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request → check out the PR branch; workflow_dispatch
          # (or anything else) → fall back to the dispatched branch.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.autofix_token || secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - name: Refresh pubspec.lock
        run: flutter pub get

      - name: Regenerate codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate l10n (if configured)
        shell: bash
        run: |
          if [ -f l10n.yaml ]; then
            flutter gen-l10n
          else
            echo "::notice::No l10n.yaml found — skipping flutter gen-l10n"
          fi

      - name: Apply dart format
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.dart' | grep -v '\.g\.dart$')
          if [ ${#files[@]} -gt 0 ]; then
            printf '%s\0' "${files[@]}" | xargs -0 dart format --line-length 120
          fi

      - name: Commit & push fixup if needed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No autofix changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: autofix lockfile, codegen and formatting"
          git push
          echo "::notice::Autofix commit pushed. CI will only re-run automatically if autofix_token is configured."
