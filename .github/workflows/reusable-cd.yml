name: CD — Reusable

on:
  workflow_call:
    inputs:
      flutter_version:
        type: string
        required: true
      working_dir:
        type: string
        default: frontend
      android_app_id:
        type: string
        required: true
      ios_bundle_id:
        type: string
        required: true
      core_access_app_id:
        type: string
        required: true
      coverage_threshold:
        type: number
        default: 70
      coverage_exclude:
        description: >-
          Regex (awk ERE) auf die Dateipfade in lcov.info; passende Dateien
          zählen nicht zur Coverage. Default: generierter Code (build_runner,
          freezed, slang, objectbox). Leer = alles zählt.
        type: string
        default: '\.g\.dart$|\.freezed\.dart$'
      extra_tests:
        description: >-
          Zusätzliche Testdateien außerhalb von test/, relativ zu working_dir,
          durch Leerzeichen getrennt (z. B. Tests der tool/-Skripte).
        type: string
        default: ''
      objectbox_c_version:
        description: >-
          Version der ObjectBox-C-Bibliothek (z. B. 5.3.2), die vor den Tests
          geladen wird. Ohne sie überspringen ObjectBox-Tests sich auf Linux
          selbst. Leer = kein Download. Nur zusammen mit objectbox_c_sha256.
        type: string
        default: ''
      objectbox_c_sha256:
        description: SHA-256 von objectbox-linux-x64.tar.gz der obigen Version.
        type: string
        default: ''
      has_screenshots:
        description: Screenshot-Generierung ausführen und in Stores hochladen
        type: boolean
        default: true
      deploy_ios:
        description: iOS nach App Store deployen (wird bei Tag-Releases immer gesetzt)
        type: boolean
        default: false
      xcode_version:
        description: >-
          Xcode für den iOS-Build; muss auf dem macos-26-Image als
          /Applications/Xcode_<version>.app liegen (Liste: actions/runner-images,
          images/macos/macos-26-arm64-Readme.md). App Store Connect nimmt seit
          28.04.2026 nur Builds mit Xcode 26 und iOS-26-SDK an.
        type: string
        default: '26.6'
      ruby_version:
        type: string
        default: '3.4.2'

jobs:
  # ─────────────────────────────────────────
  # 0. Track + Version aus Trigger ableiten
  # ─────────────────────────────────────────
  resolve-context:
    name: Resolve Version & Track
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.ctx.outputs.track }}
      version_name: ${{ steps.ctx.outputs.version_name }}
    steps:
      - id: ctx
        run: |
          REF="$GITHUB_REF"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/v}"
            if [[ "$TAG" == *"-alpha"* ]]; then
              TRACK="alpha"
            elif [[ "$TAG" == *"-beta"* ]]; then
              TRACK="beta"
            else
              TRACK="production"
            fi
            VERSION=$(echo "$TAG" | grep -oP '^\d+\.\d+\.\d+')
          else
            TRACK="internal"
            VERSION=""
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Ref: $REF → Track: $TRACK, Version: $VERSION"

  # ─────────────────────────────────────────
  # 1. Test Gate
  # ─────────────────────────────────────────
  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    needs: resolve-context
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@v1.11.0
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get
      - run: flutter analyze --fatal-infos

      - name: ObjectBox native library
        if: inputs.objectbox_c_version != ''
        env:
          OBX_VERSION: ${{ inputs.objectbox_c_version }}
          OBX_SHA256: ${{ inputs.objectbox_c_sha256 }}
        # Tests that open a Store probe for libobjectbox.so and skip themselves
        # when it is missing, which on a Linux runner is always. Pinned by
        # checksum, since it is native code loaded into the test process.
        run: |
          set -euo pipefail
          if [ -z "$OBX_SHA256" ]; then
            echo "::error::objectbox_c_version ist gesetzt, objectbox_c_sha256 nicht"
            exit 1
          fi
          dir="$RUNNER_TEMP/objectbox"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/objectbox.tar.gz" \
            "https://github.com/objectbox/objectbox-c/releases/download/v${OBX_VERSION}/objectbox-linux-x64.tar.gz"
          echo "${OBX_SHA256}  $dir/objectbox.tar.gz" | sha256sum -c -
          tar -xzf "$dir/objectbox.tar.gz" -C "$dir"
          echo "LD_LIBRARY_PATH=$dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        env:
          EXTRA_TESTS: ${{ inputs.extra_tests }}
        run: |
          mapfile -t tests < <(find test -name "*_test.dart" ! -path "test/screenshots/*")
          read -r -a extra <<< "$EXTRA_TESTS"
          flutter test --coverage "${tests[@]}" "${extra[@]}"

      - name: Coverage Gate (${{ inputs.coverage_threshold }}%)
        shell: bash
        env:
          MIN_COVERAGE: ${{ inputs.coverage_threshold }}
          COVERAGE_EXCLUDE: ${{ inputs.coverage_exclude }}
        # Same computation as reusable-ci.yml: straight from lcov.info, and an
        # unmeasurable coverage fails instead of passing.
        run: |
          set -euo pipefail
          LCOV=coverage/lcov.info
          if [ ! -s "$LCOV" ]; then
            echo "::error::$LCOV fehlt oder ist leer — Coverage nicht messbar"
            exit 1
          fi
          read -r HIT FOUND SKIPPED < <(awk -F: '
            BEGIN { ex = ENVIRON["COVERAGE_EXCLUDE"] }
            /^SF:/ { skip = (ex != "" && substr($0, 4) ~ ex); if (skip) n++ }
            /^LH:/ && !skip { h += $2 }
            /^LF:/ && !skip { f += $2 }
            END { print h + 0, f + 0, n + 0 }' "$LCOV")
          if [ "$SKIPPED" -gt 0 ]; then
            echo "Ohne ${SKIPPED} Datei(en) passend zu coverage_exclude: ${COVERAGE_EXCLUDE}"
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::$LCOV enthält keine Zeilen (LF=0) — Coverage nicht messbar"
            exit 1
          fi
          TOTAL=$(awk -v h="$HIT" -v f="$FOUND" 'BEGIN {printf "%.2f", 100 * h / f}')
          echo "Coverage: ${TOTAL}% (${HIT}/${FOUND} Zeilen)"
          if awk -v t="$TOTAL" -v min="$MIN_COVERAGE" 'BEGIN {exit !(t < min)}'; then
            echo "::error::Coverage ${TOTAL}% unter Schwelle (${MIN_COVERAGE}%) — Release blockiert"
            exit 1
          fi
          echo "PASS"

  # ─────────────────────────────────────────
  # 2. Screenshot-Generierung (opt-in)
  # ─────────────────────────────────────────
  generate-screenshots:
    name: Generate Store Screenshots
    if: inputs.has_screenshots
    needs: test-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@v1.11.0
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - name: Generate screenshot goldens
        run: flutter test test/screenshots/ --update-goldens

      - name: Collect screenshots into store layout
        run: bash scripts/collect_screenshots.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-screenshots
          path: ${{ inputs.working_dir }}/android/fastlane/metadata/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-screenshots
          path: ${{ inputs.working_dir }}/ios/fastlane/screenshots/

  # ─────────────────────────────────────────
  # 3. Android Release Build + Play Store
  # ─────────────────────────────────────────
  deploy-android:
    name: Android → Google Play (${{ needs.resolve-context.outputs.track }})
    needs: [resolve-context, test-gate, generate-screenshots]
    if: |
      always() &&
      needs.test-gate.result == 'success' &&
      (needs.generate-screenshots.result == 'success' || needs.generate-screenshots.result == 'skipped') &&
      vars.DEPLOY_ANDROID_ENABLED != 'false'
    # The versionCode is derived from Play, so two overlapping runs would pick
    # the same one (and a new Play edit invalidates the other run's upload).
    # queue: max keeps every waiting run; the default drops all but the newest
    # pending one without a failure notification.
    concurrency:
      group: cd-android-${{ inputs.android_app_id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@v1.11.0
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - name: Keystore dekodieren
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Store Notes generieren
        env:
          VERSION_NAME: ${{ needs.resolve-context.outputs.version_name }}
        run: |
          if dart run onceinaweihl_core:generate_store_notes \
              --version "$VERSION_NAME" \
              --ios-fastlane-dir ios/fastlane \
              --android-fastlane-dir android/fastlane \
              --whatsnew-dir whatsnew; then
            echo "Store Notes aus What's New JSON generiert"
          else
            # Fallback: aus CHANGELOG.md extrahieren
            DE=$(awk '/^## /{count++; if(count==2)exit} count==1' CHANGELOG.md | tail -n +2 | sed '/^$/d' | head -c 490)
            EN=$(awk '/^## /{count++; if(count==2)exit} count==1' CHANGELOG.en.md 2>/dev/null | tail -n +2 | sed '/^$/d' | head -c 490 || echo "$DE")
            mkdir -p whatsnew
            echo "$DE" > whatsnew/whatsnew-de-DE
            echo "$EN" > whatsnew/whatsnew-en-US
          fi
          # The generator exits 0 when the JSON has no entry for this version
          # ("No files written."), and Play then ships the release with no
          # "What's new" at all. A generic line beats an empty one; the
          # warning shows up on the run summary.
          if ! compgen -G 'whatsnew/whatsnew-*' > /dev/null; then
            echo "::warning::No release notes for ${VERSION_NAME} in assets/whats_new; Google Play gets a generic text."
            mkdir -p whatsnew
            echo 'Fehlerbehebungen und Verbesserungen.' > whatsnew/whatsnew-de-DE
            echo 'Bug fixes and improvements.' > whatsnew/whatsnew-en-US
          fi

      # Highest versionCode on any Play track + 1. github.run_number falls
      # behind codes uploaded outside CI (local deploys), and Play rejects a
      # release that isn't above the current one. Plain openssl/curl/jq so
      # apps without an android/Gemfile keep working.
      - name: Nächsten versionCode aus Google Play ermitteln
        id: version_code
        env:
          PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PACKAGE: ${{ inputs.android_app_id }}
        run: |
          set -o pipefail
          b64url() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }

          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(jq -nc --arg iss "$(jq -r .client_email <<<"$PLAY_JSON_KEY")" --argjson now "$NOW" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/androidpublisher",
              aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 600)}' | b64url)
          SIG=$(printf '%s.%s' "$HEADER" "$CLAIMS" \
            | openssl dgst -sha256 -sign <(jq -r .private_key <<<"$PLAY_JSON_KEY") | b64url)
          TOKEN=$(curl -fsS https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            -d assertion="$HEADER.$CLAIMS.$SIG" | jq -r .access_token)
          echo "::add-mask::$TOKEN"

          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits"
          AUTH="Authorization: Bearer $TOKEN"
          EDIT=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{}' "$API" | jq -r .id)
          HIGHEST=$(curl -fsS -H "$AUTH" "$API/$EDIT/tracks" \
            | jq '[.tracks[]?.releases[]?.versionCodes[]? | tonumber] | max // 0')
          curl -fsS -X DELETE -H "$AUTH" "$API/$EDIT" >/dev/null

          echo "Höchster versionCode auf Google Play: $HIGHEST"
          echo "code=$((HIGHEST + 1))" >> "$GITHUB_OUTPUT"

      - name: Build Android AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WIREDASH_PROJECT_ID: ${{ secrets.WIREDASH_PROJECT_ID }}
          WIREDASH_SECRET: ${{ secrets.WIREDASH_SECRET }}
          VERSION_CODE: ${{ steps.version_code.outputs.code }}
          VERSION_NAME: ${{ needs.resolve-context.outputs.version_name }}
        # --build-name like the iOS build instead of rewriting pubspec.yaml.
        # VERSION_NAME is empty outside tag builds; the pubspec version applies.
        run: |
          flutter build appbundle --release \
            ${VERSION_NAME:+"--build-name=$VERSION_NAME"} \
            --build-number="$VERSION_CODE" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define=WIREDASH_PROJECT_ID="$WIREDASH_PROJECT_ID" \
            --dart-define=WIREDASH_SECRET="$WIREDASH_SECRET"

      - name: Debug-Symbols sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-symbols-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ inputs.working_dir }}/build/app/outputs/symbols/
          retention-days: 90

      - name: Download Android screenshots
        if: inputs.has_screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-screenshots
          path: ${{ inputs.working_dir }}/android/fastlane/metadata/

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ${{ inputs.working_dir }}/android

      - name: Screenshots hochladen
        if: inputs.has_screenshots
        working-directory: ${{ inputs.working_dir }}/android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: bundle exec fastlane upload_screenshots

      - name: AAB zu Google Play hochladen
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: ${{ inputs.android_app_id }}
          releaseFiles: ${{ inputs.working_dir }}/build/app/outputs/bundle/release/app-release.aab
          track: ${{ needs.resolve-context.outputs.track }}
          status: completed
          whatsNewDirectory: ${{ inputs.working_dir }}/whatsnew/

  # ─────────────────────────────────────────
  # 4. iOS Release Build + App Store
  # ─────────────────────────────────────────
  deploy-ios:
    name: iOS → App Store (${{ needs.resolve-context.outputs.track }})
    needs: [resolve-context, test-gate, generate-screenshots]
    if: |
      always() &&
      needs.test-gate.result == 'success' &&
      (needs.generate-screenshots.result == 'success' || needs.generate-screenshots.result == 'skipped') &&
      vars.DEPLOY_IOS_ENABLED != 'false' &&
      inputs.deploy_ios
    # The build number is derived from App Store Connect, so two overlapping
    # runs would pick the same one. queue: max keeps every waiting run.
    concurrency:
      group: cd-ios-${{ inputs.ios_bundle_id }}
      cancel-in-progress: false
      queue: max
    # macos-26 carries every Xcode 26.x; macos-15 stops at 26.3.
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # First, before the slow setup, and naming the versions the image does
      # have; xcode-select alone only says "invalid developer directory".
      - name: Xcode ${{ inputs.xcode_version }} prüfen und auswählen
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE" ]; then
            installed=""
            for app in /Applications/Xcode_*.app; do
              [ -e "$app" ] || continue
              v="${app#/Applications/Xcode_}"
              installed="$installed ${v%.app}"
            done
            echo "::error title=Xcode ${XCODE_VERSION} fehlt::${XCODE} gibt es auf diesem Runner (${ImageOS:-?}, Image ${ImageVersion:-?}) nicht. Vorhanden:${installed:- keins}. xcode_version auf eine davon setzen — App Store Connect nimmt seit 28.04.2026 nur Builds mit Xcode 26 und iOS-26-SDK an."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ${{ inputs.working_dir }}/ios

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@v1.11.0
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - name: Zertifikate via Fastlane Match
        working-directory: ${{ inputs.working_dir }}/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bundle exec fastlane match appstore --readonly

      # Latest build number in App Store Connect + 1, from the same lane
      # scripts/deploy_ios.sh asks, so CI and local deploys count on one
      # sequence. github.run_number collided with the timestamps local
      # deploys uploaded.
      - name: Nächste Build-Nummer aus App Store Connect ermitteln
        id: build_number
        working-directory: ${{ inputs.working_dir }}/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          FILE=../build/next_build_number
          rm -f "$FILE"
          bundle exec fastlane next_build_number
          NUMBER=$(cat "$FILE" 2>/dev/null || true)
          if ! [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Die Lane next_build_number muss die nächste Build-Nummer nach <working_dir>/build/next_build_number schreiben; gelesen: '${NUMBER}'"
            exit 1
          fi
          echo "Nächste Build-Nummer: $NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      # --build-name instead of rewriting pubspec.yaml with `sed -i`, which
      # BSD sed on macOS reads as a backup suffix and fails on tag builds.
      # VERSION_NAME is empty outside tag builds; the pubspec version applies.
      - name: Build iOS IPA
        env:
          WIREDASH_PROJECT_ID: ${{ secrets.WIREDASH_PROJECT_ID }}
          WIREDASH_SECRET: ${{ secrets.WIREDASH_SECRET }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
          VERSION_NAME: ${{ needs.resolve-context.outputs.version_name }}
        run: |
          flutter build ipa --release \
            ${VERSION_NAME:+"--build-name=$VERSION_NAME"} \
            --build-number="$BUILD_NUMBER" \
            --dart-define=WIREDASH_PROJECT_ID="$WIREDASH_PROJECT_ID" \
            --dart-define=WIREDASH_SECRET="$WIREDASH_SECRET"

      - name: Download iOS screenshots
        if: inputs.has_screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-screenshots
          path: ${{ inputs.working_dir }}/ios/fastlane/screenshots/

      - name: Screenshots hochladen
        if: inputs.has_screenshots
        working-directory: ${{ inputs.working_dir }}/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          bundle exec fastlane deliver \
            --skip_binary_upload \
            --screenshots_path screenshots/ \
            --overwrite_screenshots \
            --skip_metadata

      - name: IPA zu App Store Connect hochladen
        working-directory: ${{ inputs.working_dir }}/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
          TRACK: ${{ needs.resolve-context.outputs.track }}
        run: |
          if [ "$TRACK" = "production" ]; then
            bundle exec fastlane deliver \
              --ipa ../build/ios/ipa/*.ipa \
              --submit_for_review
          else
            bundle exec fastlane pilot upload \
              --ipa ../build/ios/ipa/*.ipa \
              --skip_waiting_for_build_processing true
          fi
