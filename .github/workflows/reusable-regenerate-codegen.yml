name: Regenerate Codegen — Reusable

# Manually triggered workflow that regenerates generated source files
# (build_runner output: *.g.dart / *.freezed.dart, plus flutter gen-l10n
# output: app_localizations*.dart, plus pubspec.lock when pubspec.yaml
# changed) against the current dependency state and pushes the result
# back to the branch the workflow was dispatched on.
#
# Use this when:
# - the codegen-check job in reusable-ci.yml fails because committed
#   generated files have drifted from what the current toolchain
#   produces (e.g. after a dependency bump that changes generator
#   output, or after editing .arb files without local Flutter access)
# - a Renovate pub PR landed without a pubspec.lock update because
#   the Mend-hosted runner cannot auth our private git deps; the
#   regenerate workflow runs `flutter pub get` here under
#   setup-core-auth, so the lockfile gets refreshed on the PR branch
#
# Trigger from the consumer repo's Actions tab via workflow_dispatch on
# the branch you want to fix.

on:
  workflow_call:
    inputs:
      flutter_version:
        type: string
        required: true
      working_dir:
        type: string
        default: .
      core_access_app_id:
        type: string
        required: true
    secrets:
      CORE_ACCESS_APP_KEY:
        description: >-
          Private key for the Onceinaweihl Core Access GitHub App, used to
          authenticate `flutter pub get` against the private onceinaweihl_core
          package.
        required: true
      autofix_token:
        description: >-
          Optional PAT or GitHub App token with contents:write. When set, the
          regenerate push is performed under this identity, which DOES
          re-trigger downstream workflows. Falls back to GITHUB_TOKEN if not
          provided (push will not re-trigger CI in that case).
        required: false

jobs:
  regenerate:
    name: Regenerate Codegen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.autofix_token || secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - name: Regenerate build_runner output
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate l10n (if configured)
        shell: bash
        run: |
          if [ -f l10n.yaml ]; then
            flutter gen-l10n
          else
            echo "::notice::No l10n.yaml found — skipping flutter gen-l10n"
          fi

      - name: Commit & push if needed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- '*.g.dart' '*.freezed.dart' '*app_localizations*.dart' 'pubspec.lock')" ]; then
            echo "::notice::Generated code already up to date — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.g.dart' '*.freezed.dart' '*app_localizations*.dart' 'pubspec.lock' 2>/dev/null || true
          git commit -m "chore: regenerate generated code"
          git push
          echo "::notice::Generated code regenerated and pushed. CI will only re-run automatically if autofix_token is configured."