name: Security Nightly — Reusable

# Daily scan against the freshly-downloaded Trivy DB. The PR-gate in
# reusable-ci.yml covers "is this PR clean"; this covers "is what's on
# main still clean given what was disclosed in the last 24h". Findings
# open or update a GitHub issue — they do NOT fail the workflow,
# because a stale-because-red build is worse than a tracked issue.
#
# Action is SHA-pinned per the March 2026 trivy-action supply-chain
# incident; see reusable-ci.yml security-scan job for context.

on:
  workflow_call:
    inputs:
      flutter_version:
        type: string
        required: true
      working_dir:
        type: string
        default: frontend
      core_access_app_id:
        type: string
        required: true
      severity:
        description: Severity levels to report
        type: string
        default: 'HIGH,CRITICAL'

jobs:
  scan:
    name: Nightly Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    env:
      # Job-level env so the renovate regex manager (annotation directly
      # above a `key: value` line) can track the binary version.
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: v0.74.0
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      # First call: JSON for the issue body. SHA-pinned per supply-chain
      # incident; see reusable-ci.yml for context.
      # renovate: action=aquasecurity/trivy-action
      - name: Run Trivy (JSON for issue body)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_dir }}
          scanners: vuln,secret
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: '0'             # never fail the workflow
          format: json
          output: trivy-results.json
          version: ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

      # Second call: SARIF for the Security tab. skip-setup-trivy reuses
      # the binary installed by the first call.
      # renovate: action=aquasecurity/trivy-action
      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_dir }}
          scanners: vuln,secret
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
          skip-setup-trivy: true
          version: ${{ env.TRIVY_VERSION }}

      # Private repos without Advanced Security have Code Scanning disabled
      # and reject the upload with 403; the tracking issue below still runs.
      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif  # workspace root, see Render step
          category: trivy-nightly

      - name: Render findings as Markdown
        id: findings
        shell: bash
        run: |
          python3 - <<'PY' > "$GITHUB_WORKSPACE/findings.md"
          import json
          import os
          import pathlib

          def set_count(n):
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"count={n}\n")

          # trivy-action is a composite action: its steps ignore the job's
          # working-directory and write into the workspace root.
          path = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "trivy-results.json"
          if not path.exists():
              raise SystemExit(f"{path} missing: the Trivy scan produced no output")

          doc = json.loads(path.read_text() or "{}")
          results = doc.get("Results") or []

          rows = []
          for r in results:
              target = r.get("Target", "?")
              for v in (r.get("Vulnerabilities") or []):
                  rows.append((
                      target,
                      v.get("Severity", "?"),
                      v.get("PkgName", "?"),
                      v.get("InstalledVersion", "?"),
                      v.get("FixedVersion", "—"),
                      v.get("VulnerabilityID", "?"),
                      v.get("PrimaryURL", ""),
                  ))
              for s in (r.get("Secrets") or []):
                  rows.append((
                      target,
                      s.get("Severity", "?"),
                      "[secret]",
                      "—",
                      "—",
                      s.get("RuleID", "?"),
                      "",
                  ))

          set_count(len(rows))
          if not rows:
              print("_(0 findings)_")
              raise SystemExit(0)

          print(f"**{len(rows)} finding(s)** at severity ${{ inputs.severity }}.")
          print()
          print("| Target | Severity | Package | Installed | Fixed | ID |")
          print("|--------|----------|---------|-----------|-------|----|")
          for target, sev, pkg, inst, fix, vid, url in rows:
              id_cell = f"[{vid}]({url})" if url else vid
              print(f"| `{target}` | {sev} | {pkg} | {inst} | {fix} | {id_cell} |")

          print()
          print("---")
          print()
          print("Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          PY

      # create-issue-from-file has no dedupe of its own: it updates only when
      # given an issue-number, otherwise it opens a new issue every night.
      # With zero findings no issue is opened, but an open one is refreshed.
      - name: Find open tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Security: nightly Trivy scan findings"' --json number,title \
            --jq '[.[] | select(.title == "Security: nightly Trivy scan findings")][0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.findings.outputs.count != '0' || steps.issue.outputs.number != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Security: nightly Trivy scan findings'
          content-filepath: findings.md
          labels: security,nightly-scan
          issue-number: ${{ steps.issue.outputs.number }}