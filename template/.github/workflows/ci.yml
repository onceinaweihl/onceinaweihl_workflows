name: CI — Pull Request Checks

# Docs-only changes skip CI. If a ruleset ever requires these checks, a
# skipped workflow reports no status and the PR waits forever; then the
# filter has to move into the reusable workflow.
on:
  pull_request:
    branches: [main, develop]
    paths-ignore: [docs/**, frontend/docs/**, "**/*.md"]
  push:
    branches: [develop]
    paths-ignore: [docs/**, frontend/docs/**, "**/*.md"]

# The Security Scan job uploads SARIF; a reusable workflow cannot ask for
# more than its caller grants.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: onceinaweihl/onceinaweihl_workflows/.github/workflows/reusable-ci.yml@v1.9.2
    with:
      # renovate: datasource=flutter-version depName=flutter
      flutter_version: '3.41.4'        # ← anpassen
      working_dir: frontend             # ← anpassen falls abweichend
      coverage_threshold: 70            # ← anpassen
      core_access_app_id: ${{ vars.CORE_ACCESS_APP_ID }}
    secrets: inherit
