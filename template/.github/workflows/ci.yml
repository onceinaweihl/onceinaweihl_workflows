name: CI — Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# The Security Scan job uploads SARIF; a reusable workflow cannot ask for
# more than its caller grants.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: onceinaweihl/onceinaweihl_workflows/.github/workflows/reusable-ci.yml@v1.9.2 # x-release-please-version
    with:
      # renovate: datasource=flutter-version depName=flutter
      flutter_version: '3.41.4'        # ← anpassen
      working_dir: frontend             # ← anpassen falls abweichend
      coverage_threshold: 70            # ← anpassen
      core_access_app_id: ${{ vars.CORE_ACCESS_APP_ID }}
      run_ios_build: false
    secrets: inherit
