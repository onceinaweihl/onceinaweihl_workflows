name: Setup core repo auth
description: >-
  Mints a short-lived GitHub App token scoped to one or more onceinaweihl
  repositories and rewrites https://github.com/ clones to use it. Must run
  after actions/checkout and before any step that resolves git:
  dependencies (e.g. flutter pub get) or that needs to clone additional
  private org repos.

inputs:
  app-id:
    description: GitHub App ID. Pass vars.CORE_ACCESS_APP_ID from the caller workflow.
    required: true
  private-key:
    description: GitHub App private key in PEM. Pass secrets.CORE_ACCESS_APP_KEY from the caller workflow.
    required: true
  repositories:
    description: >-
      Comma- or newline-separated list of repository names (without owner)
      the minted token should grant access to. Defaults to onceinaweihl_core
      so existing callers keep working unchanged. Override e.g. with
      "onceinaweihl_core,claude-plugins" when a workflow also needs to
      clone the plugin repo.
    required: false
    default: onceinaweihl_core

outputs:
  token:
    description: >-
      The minted installation token. Exposed so callers can pass it
      explicitly to e.g. actions/checkout when cloning a private repo
      the default GITHUB_TOKEN doesn't have access to.
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate org-scoped access token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: onceinaweihl
        repositories: ${{ inputs.repositories }}

    - name: Rewrite github.com clones to authenticated URL
      shell: bash
      env:
        GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "https://github.com/"
