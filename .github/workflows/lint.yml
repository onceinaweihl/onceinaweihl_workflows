name: Lint workflows

# actionlint (syntax, expressions, shellcheck on run: blocks) and zizmor
# (security: injection, pinning, token scope) over the reusable workflows,
# the composite action and the app templates. zizmor reads zizmor.yml,
# actionlint reads .github/actionlint.yaml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=pypi depName=actionlint-py
      ACTIONLINT_VERSION: 1.7.12.25
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # shellcheck ships with the ubuntu runner image; actionlint picks it up.
      - name: actionlint
        run: |
          pipx run --spec "actionlint-py==${ACTIONLINT_VERSION}" actionlint
          pipx run --spec "actionlint-py==${ACTIONLINT_VERSION}" actionlint template/.github/workflows/*.yml

      - name: zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --format github .
