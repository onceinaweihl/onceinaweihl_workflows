name: CI — Reusable

on:
  workflow_call:
    inputs:
      flutter_version:
        type: string
        required: true
      working_dir:
        type: string
        default: frontend
      coverage_threshold:
        type: number
        default: 70
      core_access_app_id:
        type: string
        required: true
      run_android_build:
        description: Android Debug Build ausführen (default on)
        type: boolean
        default: true
      run_ios_build:
        description: iOS Debug Build ausführen (kostet macOS-Minutes, default off)
        type: boolean
        default: false
      xcode_version:
        type: string
        default: '15.4'
      security_enabled:
        description: Trivy Security Scan ausführen (vuln + secret + misconfig)
        type: boolean
        default: true
      security_severity:
        description: Severity-Schwelle die den Build failed (Komma-getrennt)
        type: string
        default: 'HIGH,CRITICAL'

jobs:
  # ─────────────────────────────────────────
  # 1. Lint & Format
  # ─────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - name: Dart format check
        run: |
          git ls-files '*.dart' | grep -v '\.g\.dart$' | xargs dart format --line-length 120 --output=none --set-exit-if-changed

      - run: flutter analyze --fatal-infos

  # ─────────────────────────────────────────
  # 2. Code-Generierung prüfen
  # ─────────────────────────────────────────
  codegen-check:
    name: Code Generation Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Check for uncommitted generated files
        run: |
          if [ -n "$(git status --porcelain -- '*.g.dart')" ]; then
            echo "Generated files are out of date. Run 'dart run build_runner build' and commit the result."
            git status --porcelain -- '*.g.dart'
            exit 1
          fi

  # ─────────────────────────────────────────
  # 3. Unit & Widget Tests
  # ─────────────────────────────────────────
  unit-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      - name: Run tests with coverage
        run: |
          flutter test \
            --coverage \
            --coverage-path=coverage/lcov.info \
            --exclude-tags=integration \
            $(find test -name "*_test.dart" ! -path "test/screenshots/*" | tr '\n' ' ')

      - name: Check coverage threshold (${{ inputs.coverage_threshold }}%)
        run: |
          TOTAL=$(lcov --summary coverage/lcov.info 2>&1 \
            | grep "lines" | grep -oP '[\d.]+(?=%)' | head -1)
          echo "Coverage: ${TOTAL}%"
          if (( $(echo "$TOTAL < ${{ inputs.coverage_threshold }}" | bc -l) )); then
            echo "FAIL: Coverage ${TOTAL}% unter Schwelle (${{ inputs.coverage_threshold }}%)"
            exit 1
          fi
          echo "PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.working_dir }}/coverage/

  # ─────────────────────────────────────────
  # 4. Android Debug Build (opt-out via run_android_build)
  # ─────────────────────────────────────────
  build-android:
    name: Android Debug Build
    if: inputs.run_android_build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get
      - run: flutter build apk --debug

  # ─────────────────────────────────────────
  # 5. iOS Debug Build (opt-in, spart macOS-Minutes)
  # ─────────────────────────────────────────
  build-ios:
    name: iOS Debug Build
    if: inputs.run_ios_build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ inputs.xcode_version }}
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode_version }}.app

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  # ─────────────────────────────────────────
  # 6. Security Scan (Trivy)
  # ─────────────────────────────────────────
  # Blocks PRs that introduce HIGH/CRITICAL vulns, secrets, or
  # misconfigurations. Severity threshold and on/off-switch are configurable
  # via the security_enabled / security_severity inputs.
  #
  # Action is SHA-pinned after the March 2026 supply-chain incident
  # (aquasecurity/trivy-action: 75 tags force-pushed to malicious commits).
  # Renovate keeps the pin fresh via the `# renovate:` annotation — do
  # NOT replace it with a floating tag.
  security-scan:
    name: Security Scan
    if: inputs.security_enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write     # upload SARIF to Security tab
      actions: read              # required by upload-sarif on private repos
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - uses: actions/checkout@v4

      # Generate the pubspec.lock + transitive lockfiles Trivy needs to
      # resolve Dart vulns. Doing this before the scan means findings
      # don't depend on whether Renovate has run on this branch yet.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: onceinaweihl/onceinaweihl_workflows/actions/setup-core-auth@main
        with:
          app-id: ${{ inputs.core_access_app_id }}
          private-key: ${{ secrets.CORE_ACCESS_APP_KEY }}

      - run: flutter pub get

      # Trivy binary version. Action and binary versions are independent;
      # both pinned for reproducibility.
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      - name: Set Trivy version
        run: echo "TRIVY_VERSION=v0.58.1" >> "$GITHUB_ENV"

      # SHA-pinned to v0.36.0 per March 2026 supply-chain incident.
      # renovate: action=aquasecurity/trivy-action
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_dir }}
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.security_severity }}
          ignore-unfixed: true       # don't fail on CVEs without an upstream fix yet
          exit-code: '1'             # fail the step on any matching finding
          format: sarif
          output: trivy-results.sarif
          version: ${{ env.TRIVY_VERSION }}
        env:
          # Trivy DB mirrored to GHCR; Docker Hub ratelimits bite us otherwise.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

      # Upload SARIF even when the previous step failed, so findings show
      # up in the Security tab while the PR is blocked.
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.working_dir }}/trivy-results.sarif
          category: trivy-fs